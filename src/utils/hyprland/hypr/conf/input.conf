# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = it
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    
    natural_scroll = false
    scroll_factor = 1.0

    touchpad {
        natural_scroll = true
        scroll_factor = 1.0
    }
    sensitivity = 0
}

