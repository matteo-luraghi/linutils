# Execute your favorite apps at launch
exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = blueman-applet

# Load configuration from ML4W Hyprland Settings App
exec = ~/.config/ml4w-hyprland-settings/hyprctl.sh
exec-once = systemctl --user start pipewire pipewire-pulse wireplumber

# Start the clipboard store (text and images)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Authentication tool (for windows drive)
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
